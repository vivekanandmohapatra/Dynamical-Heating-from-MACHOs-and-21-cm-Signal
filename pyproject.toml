[project]
name = "dark-ages-21cm-macho"
version = "0.1.0"
description = "Dark-ages 21-cm global signal with MACHO dynamical-friction heating"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "colossus>=1.3",
]

[project.optional-dependencies]
dev = ["black>=24.0", "ruff>=0.5", "pytest>=8.0"]

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "ARG", "PL", "RUF"]
ignore = [
    # Physical constants and paper symbols keep their conventional
    # spelling (GeV, T_M, X_e, M_c) instead of PEP 8 casing rules.
    "N801", "N802", "N803", "N806", "N815", "N816",
    # Scripts print progress to stdout by design.
    "T201",
    # Physics formulae contain many literal constants.
    "PLR2004",
    # Model constructors legitimately take many physical parameters.
    "PLR0913", "PLR0912", "PLR0915", "PLR0917",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["units", "cosmology_terms", "thermal_evolution"]
